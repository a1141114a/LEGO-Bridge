<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140"><title>Playful brick figures: photo</title><defs><g id="figure"><ellipse cx="0" cy="58" rx="27" ry="4" fill="#18222b" opacity=".08"/><g class="legs"><rect x="-18" y="26" width="17" height="29" rx="3" fill="#243e6b"/><rect x="1" y="26" width="17" height="29" rx="3" fill="#2b4c80"/></g><path d="M-20-7h40l5 34h-50z" fill="var(--shirt,#ef604c)"/><path d="M-16-2h32" stroke="white" stroke-width="4" opacity=".35"/><g class="left-arm"><rect x="-33" y="-7" width="12" height="31" rx="5" fill="var(--shirt,#ef604c)"/><path d="M-30 25a6 6 0 1 0 5 0" stroke="#f6be35" stroke-width="7" fill="none"/></g><g class="right-arm"><rect x="21" y="-7" width="12" height="31" rx="5" fill="var(--shirt,#ef604c)"/><path d="M24 25a6 6 0 1 0 5 0" stroke="#f6be35" stroke-width="7" fill="none"/></g><rect x="-8" y="-45" width="16" height="9" rx="3" fill="#f7c544"/><rect x="-21" y="-37" width="42" height="33" rx="9" fill="#ffcf4d"/><circle cx="-8" cy="-23" r="2.5" fill="#26333e"/><circle cx="8" cy="-23" r="2.5" fill="#26333e"/><path d="M-7-15q7 8 14 0" stroke="#26333e" stroke-width="2.5" stroke-linecap="round" fill="none"/></g></defs><style>svg{overflow:hidden}.left-arm{transform-origin:-26px -3px}.right-arm{transform-origin:26px -3px}.runner .left-arm{animation:swing .4s ease-in-out infinite alternate}.runner .right-arm{animation:swing .4s ease-in-out infinite alternate-reverse}.runner .legs{animation:step .2s ease-in-out infinite alternate}.body-bob{animation:bob .4s ease-in-out infinite alternate}@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}@keyframes step{to{transform:skewX(9deg) translateY(-2px)}}@keyframes bob{to{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.photographer{--shirt:#9b83c5}.photographer .right-arm{transform:rotate(-90deg)}.flash{animation:flash 4s infinite}.pose{animation:pose 4s ease-in-out infinite;transform-origin:230px 70px}@keyframes flash{0%,58%,66%,100%{opacity:0}60%,64%{opacity:1}}@keyframes pose{0%,45%,100%{transform:rotate(0)}55%,75%{transform:rotate(-7deg)}}</style><path d="M22 114h276" stroke="#e5dfef" stroke-width="2"/><g class="photographer" transform="translate(90 76) scale(.65)"><use href="#figure"/><rect x="15" y="-30" width="33" height="23" rx="4" fill="#2d3744"/><circle cx="33" cy="-18" r="7" fill="#8cabc2"/><rect x="21" y="-35" width="10" height="6" rx="2" fill="#2d3744"/></g><g class="pose"><g transform="translate(230 76) scale(.65)" style="--shirt:#5da99a"><use href="#figure"/></g></g><path class="flash" d="M131 57l21-10-6 16 20 2-30 12 5-14z" fill="#f4c14c"/><path d="M247 26l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#f4c14c"/></svg>