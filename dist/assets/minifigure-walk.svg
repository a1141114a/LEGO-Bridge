<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140"><title>Playful brick figures: walk</title><defs><g id="figure"><ellipse cx="0" cy="58" rx="27" ry="4" fill="#18222b" opacity=".08"/><g class="legs"><rect x="-18" y="26" width="17" height="29" rx="3" fill="#243e6b"/><rect x="1" y="26" width="17" height="29" rx="3" fill="#2b4c80"/></g><path d="M-20-7h40l5 34h-50z" fill="var(--shirt,#ef604c)"/><path d="M-16-2h32" stroke="white" stroke-width="4" opacity=".35"/><g class="left-arm"><rect x="-33" y="-7" width="12" height="31" rx="5" fill="var(--shirt,#ef604c)"/><path d="M-30 25a6 6 0 1 0 5 0" stroke="#f6be35" stroke-width="7" fill="none"/></g><g class="right-arm"><rect x="21" y="-7" width="12" height="31" rx="5" fill="var(--shirt,#ef604c)"/><path d="M24 25a6 6 0 1 0 5 0" stroke="#f6be35" stroke-width="7" fill="none"/></g><rect x="-8" y="-45" width="16" height="9" rx="3" fill="#f7c544"/><rect x="-21" y="-37" width="42" height="33" rx="9" fill="#ffcf4d"/><circle cx="-8" cy="-23" r="2.5" fill="#26333e"/><circle cx="8" cy="-23" r="2.5" fill="#26333e"/><path d="M-7-15q7 8 14 0" stroke="#26333e" stroke-width="2.5" stroke-linecap="round" fill="none"/></g></defs><style>svg{overflow:hidden}.left-arm{transform-origin:-26px -3px}.right-arm{transform-origin:26px -3px}.runner .left-arm{animation:swing .4s ease-in-out infinite alternate}.runner .right-arm{animation:swing .4s ease-in-out infinite alternate-reverse}.runner .legs{animation:step .2s ease-in-out infinite alternate}.body-bob{animation:bob .4s ease-in-out infinite alternate}@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}@keyframes step{to{transform:skewX(9deg) translateY(-2px)}}@keyframes bob{to{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.walker{animation:walk 8s ease-in-out infinite;--shirt:#4e82c0}@keyframes walk{0%,100%{transform:translate(75px,76px) scale(.65)}50%{transform:translate(240px,76px) scale(.65)}}</style><path d="M22 114h276" stroke="#dce8ed" stroke-width="2"/><path d="M45 48h19v18H45zm214-8h19v18h-19z" fill="#b8d5c0"/><circle cx="50" cy="47" r="3" fill="#b8d5c0"/><circle cx="60" cy="47" r="3" fill="#b8d5c0"/><g class="walker runner"><g class="body-bob"><use href="#figure"/></g></g></svg>